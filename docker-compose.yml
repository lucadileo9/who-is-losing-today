services:
  who-is-losing-today-db:
    image: postgres:16-alpine
    container_name: who-is-losing-today-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - /srv/storage/docker/who-is-losing-today/postgres:/var/lib/postgresql/data
    networks:
      - storage_default # O il nome della rete Docker usata da Nginx

  who-is-losing-today-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: who-is-losing-today-web
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@who-is-losing-today-db:5432/${POSTGRES_DB}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@who-is-losing-today-db:5432/${POSTGRES_DB}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      - who-is-losing-today-db
    networks:
      - storage_default

networks:
  storage_default:
    external: true
