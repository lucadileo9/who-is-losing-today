version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: who_is_losing_today_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: who_is_losing_today
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
