services:
  who-is-losing-today-db-local:
    image: postgres:16-alpine
    container_name: who-is-losing-today-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-who_is_losing_today_local}
    ports:
      - '5432:5432'
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d
          ${POSTGRES_DB:-who_is_losing_today_local}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  who-is-losing-today-web-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: who-is-losing-today-web-local
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@who-is-losing-today-db-local:5432/${POSTGRES_DB:-who_is_losing_today_local}?schema=public'
      DIRECT_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@who-is-losing-today-db-local:5432/${POSTGRES_DB:-who_is_losing_today_local}?schema=public'
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local_dev_secret_key_min_32_characters_random}
      AUTH_SECRET: ${NEXTAUTH_SECRET:-local_dev_secret_key_min_32_characters_random}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: 'true'
      SEED_DEMO_DATA: 'true'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      who-is-losing-today-db-local:
        condition: service_healthy

volumes:
  pg_data_local:
